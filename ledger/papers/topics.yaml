# Every search sent to the Amass literature search. Add a query, re-run: python literature/fetch_amass.py
# (answers are cached in processed/amass_cache/, so only new queries cost credits)
#
# id               short name, used as the key in amass_papers.json
# use              what the harness uses the topic for:
#                    feature_selection   which features are worth computing (read BEFORE comparing batches)
#                    structure_function  what a feature means for the battery (read AFTER a feature separates batches)
#                    method              how to measure, segment, embed or test
#                    material_identity   what the material and the bright phase could be (Polaron has not said)
#                    sample_prep         how the cross-sections were made and what that does to the image
# feature_columns  columns of processed/features.csv the topic explains (empty = no feature built yet)
# queries          each one is a separate search, 300 papers max
#
# The material is NOT confirmed as a graphite anode, so most topics have a chemistry-neutral query
# ("lithium-ion electrode") next to the graphite one, and cathode / silicon / hard carbon have their own topics.

# Broad searches repeated for each publication-date window, to get past the 300-per-search cap.
sweeps:
  windows:
    - [null, "2014-12-31"]
    - ["2015-01-01", "2017-12-31"]
    - ["2018-01-01", "2019-12-31"]
    - ["2020-01-01", "2020-12-31"]
    - ["2021-01-01", "2021-12-31"]
    - ["2022-01-01", "2022-12-31"]
    - ["2023-01-01", "2023-12-31"]
    - ["2024-01-01", "2024-12-31"]
    - ["2025-01-01", "2025-12-31"]
    - ["2026-01-01", null]
  topics:
    - id: sweep_microstructure
      use: [feature_selection, structure_function]
      query: lithium-ion battery electrode microstructure and its effect on cell performance
    - id: sweep_manufacturing
      use: [feature_selection, structure_function]
      query: lithium-ion battery electrode manufacturing process slurry coating drying calendering
    - id: sweep_imaging
      use: [method, feature_selection]
      query: battery electrode electron microscopy tomography image analysis quantification
    - id: sweep_graphite
      use: [feature_selection, structure_function, material_identity]
      query: graphite anode lithium-ion battery particle morphology electrode structure

topics:
  # ---- The problem Polaron set: batches that differ slightly, effects that show up later ----
  - id: batch_variability
    use: [feature_selection, structure_function]
    feature_columns: [histogram_anomaly_z]
    queries:
      - batch-to-batch variability lithium-ion electrode manufacturing
      - manufacturing variability lithium-ion electrode microstructure cell performance
      - cell-to-cell variation lithium-ion battery manufacturing tolerances capacity
      - sensitivity of battery cell performance to electrode manufacturing parameter deviations
      - incoming material inspection battery raw material quality supplier variation
      - lot-to-lot variation graphite active material powder properties electrode

  - id: process_structure_property
    use: [feature_selection, structure_function]
    queries:
      - process structure property relationship lithium-ion electrode calendering drying
      - electrode microstructure heterogeneity cell performance lithium-ion
      - electrode formulation active material binder conductive additive ratio microstructure
      - microstructure descriptors predict electrode performance lithium-ion machine learning

  - id: manufacturing_qc
    use: [feature_selection, method]
    feature_columns: [histogram_anomaly_z]
    queries:
      - lithium-ion battery electrode manufacturing quality control defects
      - inline quality control metrology electrode coating battery production
      - electrode coating defects pinholes agglomerates streaks effect on cell performance
      - defect detection battery electrode images deep learning
      - scrap rate battery cell production quality assurance electrode

  - id: latent_defects
    use: [structure_function]
    queries:
      - electrode defects long-term cycling degradation lithium-ion cell ageing
      - manufacturing defect lithium-ion cell lifetime prediction early detection
      - metallic particle contamination electrode internal short circuit lithium-ion
      - electrode inhomogeneity local lithium plating ageing

  # ---- Process steps that set the microstructure ----
