    use: [feature_selection, structure_function]
    queries:
      - electrode slurry mixing dispersion agglomerates lithium-ion microstructure
      - slurry rheology electrode coating microstructure battery
      - conductive additive carbon black dispersion agglomeration electrode
      - mixing sequence slurry preparation electrode performance lithium-ion

  - id: bubbles_voids
    use: [feature_selection, structure_function]
    feature_columns: [pore_size_median_um2, pore_size_p90_um2, pore_size_count_per_1000um2]
    queries:
      - air bubbles slurry degassing electrode coating voids defects battery
      - large voids macropores electrode coating lithium-ion performance
      - void defects electrode microstructure X-ray tomography battery

  - id: drying_binder_migration
    use: [feature_selection, structure_function]
    queries:
