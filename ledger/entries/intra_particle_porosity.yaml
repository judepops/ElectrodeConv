    pores
  verified: false
- doi: 10.3390/batteries9060305
  note: >-
    Fischer et al. 2023 Batteries: spheroidisation of natural graphite changes the particle morphology
    and raises the particle surface area by a factor of 1.8, improving fast-charge capability
  verified: false
- doi: 10.3390/ma16216896
  note: >-
    Choi et al. 2023 Materials: assembled graphite with lower open intra-block porosity (9.6 -> 0.9 %)
    has higher initial Coulombic efficiency (86.4 -> 92.3 %); closed porosity proposed as a volume-expansion
    buffer
  verified: false
