- uniform patterns
family: texture
detectors:
- Inlens
- SE
status: rejected
description: Rotation-invariant uniform LBP histogram (and its entropy) at a few radii.
battery_relevance: >-
  Grey-scale invariant, so robust to brightness/contrast differences between acquisitions; describes the
  surface texture of the binder network.
findings: >-
  Texture family: no segmentation-free descriptor separates batch from acquisition. Inlens LBP R4: session
  R2 0.92 (acquisition_dominated) although it orders B1>B2>B3 in all 6 within-session contrasts - a lead
  only with more sessions. Keep as an acquisition monitor. Source: notes/feature_screen.md (Luca's empirical
  screen, 31 spots, within-mixed-session permutation test, 2026-10-03)
