id: electrolyte_access
name: Solid-to-pore distance (spherical contact distribution)
aliases:
- diffusion length
- spherical contact distribution
family: spatial_statistics
detectors:
- BSE
status: rejected
owner: luca
description: >-
  Distribution of the distance from each solid (graphite, Si) pixel to the nearest pore: mean, p90, and
  Si-to-pore median; 2D proxy for the solid-state diffusion length to electrolyte. Built as scipy EDT
  of ~h.void on the shared harmonised crop, minus-sampled (pore distance < crop-edge distance) with Hanisch
  weights; plus the Torquato pore-size function (void pixel to nearest solid) and a Si/solid median ratio.
battery_relevance: >-
  Material far from electrolyte lithiates last at high rate; a coarser/denser solid raises the distance
  (rate capability, plating risk).
findings: >-
  Rejected 2026-10-03 (Modal screen, 31 spots, split halves, 3 noise seeds, 8 perturbations; overlay check
  on cfe5vt7s/ffwubibz showed the distance map is correct). Every column is either unreliable or redundant.
  solid_pore_dist_mean_um (B1 1.13, B2 1.11, B3 1.05 um; within-session p 0.016, incoming p 0.042, LOSO
  AUC B1 0.71 / B2 0.52) and solid_pore_dist_p90_um (within p 0.005) have split-half r 0.21/0.12 and 0.17/-0.01:
  the site value is set by a few thick flake stacks in the window, so the within-session shift cannot
  be told apart from the strip-position effect. si_pore_dist_median_um and si_pore_dist_ratio (ratio B1
  0.96, B2 1.02, B3 1.09; within p 0.005, LOSO AUC B1 0.82) have split-half r -0.21/0.14 and -0.09/0.12
  (30-80 Si particles per spot). pore_size_fn_mean_um is reliable (split 0.45/0.60, perturbation 0.31)
  but redundant with pore_lt_d50_um/pore_lt_d90_um and the s2 correlation lengths. Robust alternatives
  tested locally (median distance split 0.44/0.41; share of solid > 0.5 um from a pore 0.54/0.58; > 1
  um 0.47/0.36; log-mean 0.43/0.36) are redundant at |Spearman| 0.91-0.94 with solid_lt_d50_um or interface_density_per_um.
  Session R2 0.42-0.54, perturbation 0.25-0.46 B3-SD, seed SD <= 0.04 B3-SD, 3.9 s per spot. Use solid_lt_d50_um
  / interface_density_per_um for the same mechanism. [own validation, 2026-10-03]
