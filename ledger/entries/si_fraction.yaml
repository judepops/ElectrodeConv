description: >-
  Bright (Si-based, likely SiOx) area / solid area on the shared harmonised BSE crop (adaptive midpoint
  between graphite and the image's own bright mode), plus bright/total area, its 95% single-image CI from
  the two-point correlation (ImageRep idea), the fixed-threshold (1.45 g) sensitivity recipe, and Miles-Lantuejoul
  edge-corrected counts of objects >= 1 um ECD. Replaces the multi-Otsu bright_phase_frac as the Tier-1
  Si-dose KPI.
battery_relevance: >-
  Si-phase dose sets anode capacity (N/P balance), first-cycle efficiency (SiOx irreversible silicate
  formation), swelling and Si-specific fade: higher = more capacity now, lower ICE, more expansion, faster
  fade; lower = capacity shortfall.
findings: >-
  Integrated run (rank_features.py, robustness.py): bright_solid_frac B1 0.100 | B2 0.055 | B3 0.066+-0.011;
  sep 0.79, q 0.077 (all-spot permutation, carried by the two session-2316 spots 0.16/0.20 = +8.7/+12.5
  SD; sep 0.53 without them); within-session exact p 0.24 (B1 -1.66, B2 -1.50 B3-SD, noise-level), and
  this test cannot see 2316 (B1-only session, n_eff 1 session: material vs session not separable); B2's
  raw -1.05 SD is partly the B2-only session 2048 (-0.66 SD without it) and is not confirmed within sessions;
  session R2 0.90 (chance 0.40), ICC 0.00; perturbation ratio 0.14 (fixed-threshold companion 1.83, direction
  check only). Battery: more Si phase = more anode capacity but lower ICE, more swelling and faster fade
  (trade-off; bad against a fixed cell design, where the extra capacity is mostly unused and the extra
  Li loss is not); less = capacity shortfall with slightly better ICE (trade-off, out of spec); best =
  match baseline. Number density at fixed fraction = neither (process-change sign). Verdict (Tier 1):
  B1 INVESTIGATE (Si-phase anomaly: CI [-0.011, +0.078] INCONCL, lot spread 5.4x baseline from the same
  two spots, only session-matched contrast points the other way; EDS first); B2 delta -0.012 (-1.05 SD),
  P(beyond margin) 0.24 is what alone keeps it from CONDITIONAL ACCEPT. [final pipeline, 2026-10-03; verifier
  pass]
