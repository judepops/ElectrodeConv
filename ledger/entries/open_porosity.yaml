id: open_porosity
name: Open porosity (harmonised void area fraction) with single-image CI
aliases:
- open void fraction
- porosity open frac
family: morphology
detectors:
- BSE
status: implemented
owner: luca
implemented_in: cnn/tile_features.py
columns:
- porosity_frac
v1_implemented_in: features/open_porosity
v1_columns:
- porosity_open_frac
- porosity_open_ci95_frac
- porosity_fixed060_frac
- porosity_void_threshold
description: >-
  Void area / crop area from the shared harmonised void mask (features/_common: same central crop of every
  spot, graphite-anchored, noise-matched BSE, per-image Otsu between pore and graphite, 16-px cleanup),
  plus its 95% single-image CI from the two-point correlation (ImageRep idea), a fixed 0.6-graphite-unit
  sensitivity recipe and the Otsu threshold used. A RELATIVE index (2D open void 7-15% vs plausibly 25-35%
  real porosity, because of pore-back and sub-resolution CBD pores). Replaces the multi-Otsu porosity_frac
  as the Tier-1 porosity KPI; differs from it by the shared harmonised mask, the fixed crop and the error
  bar.
battery_relevance: >-
  Electrolyte volume and ionic transport: D_eff ~ porosity^alpha (Bruggeman; alpha 1.5 for spheres, higher
  through-plane for aligned flake graphite). Trade-off, best value = match baseline. Lower = more tortuous,
  longer ion paths, poorer rate and a somewhat higher fast-charge Li-plating risk (Colclasure 2019 found
  raising porosity at fixed loading an ineffective fast-charge lever, lowering tortuosity an effective
  one), less room for Si-phase swelling (general knowledge), but higher volumetric energy density. Higher
  = the reverse, plus possibly poorer particle contact (general knowledge). Wetting is non-monotonic in
  calendering (Sheng 2014). Moved by calendering, coat weight, slurry solids, graphite PSD.
findings: >-
  Final run (rank_features.py + robustness.py, 31 spots): porosity_open_frac B1 0.089 / B2 0.102 / B3
  0.108 (B3 SD 0.018); sep 0.55, q 0.17; within-session b1 -1.64, b2 -0.85 B3-SD, joint exact p 0.17 (192
  relabellings); session R2 0.67; perturbation 0.43 (gamma only). Not established: only one B1-B3 pair
  shares a session (2080, -1.81 SD), the rest is chained through B2, and the test has ~30% power at this
  size; the raw B1 gap is -0.013 without the B3-only session 2088. B1 gap not from 2316 (one session,
  n_eff 1; without it 0.091). Battery: if real, the B1 hint is a denser electrode (slower ion transport,
  mildly more plating risk, more energy density: a trade-off); its estimate is inside the Tier-1 margin
  but the CI reaches past it (INCONCL, P 0.24, monitor); B2 EQUIV (P 0.06). void_threshold q 0.03 is session
  (within p 0.86, perturbation 1.66), not material.
