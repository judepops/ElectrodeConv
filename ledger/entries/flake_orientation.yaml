id: flake_orientation
name: Graphite flake orientation distribution
aliases:
- alignment
- anisotropy
- orientation order
- structure tensor coherence
family: orientation
detectors:
- BSE
status: v1_only
owner: luca
v1_implemented_in: features/flake_orientation
v1_columns:
- flake_orient_order
- flake_tilt_deg
description: >-
  Structure tensor of the harmonised BSE (gradient sigma 75 nm, integration 0.4 um, 50 nm/px), coherence-weighted
  over graphite/void boundary pixels (0.2 um around the Si-like bright phase excluded): nematic order
  S = <cos 2 theta> of the layer direction against the image horizontal, its tilt-invariant axial circular
  SD, and the mean layer direction (tilt, a mounting diagnostic).
battery_relevance: >-
  Calendering aligns platelet graphite parallel to the current collector, raising through-plane tortuosity
  and lowering rate capability and the lithium-plating margin at fast charge; a change of graphite shape
  or calendering pressure moves it. Used as an expected-stable ACCEPT check.
findings: >-
  Final run, no detectable batch difference: S B1 0.307 / B2 0.301 / B3 0.295; sep 0.10, q 0.97; within-session
  p 0.66 (B1 +0.48 SD, CI -1.4..+2.4; B2 +0.56 SD, CI -0.9..+2.0), so only large shifts are excluded (pooled
  ~1.3 SD, session-controlled ~2 SD). Perturbation ratio 0.074; session R2 0.52 (chance); Tier 2 passes
  7/7 in both lots; 2316 spots inside (z -0.11, -1.38; n_eff 1 session, strongest curtains, not in the
  within-session test); r 0.94 with solid_chord_hv_ratio. Battery: flatter flakes = worse rate, fast charge
  and plating (bad at equal porosity; trade-off if from harder calendering, which densifies); less aligned
  = trade-off (better transport, often lower density or a different graphite).
