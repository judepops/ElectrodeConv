id: porosity
name: Porosity (pore area fraction)
aliases:
- pore fraction
- void fraction
family: morphology
detectors:
- BSE
status: v1_only
v1_implemented_in: features/_retired/porosity
v1_columns:
- porosity_frac
description: >-
  Fraction of the BSE image classed as pore by a blurred 3-class multi-Otsu threshold (pore / graphite
  / bright phase).
battery_relevance: >-
  Sets how much electrolyte the electrode holds and how fast ions move through it. A shift points at a
  change in calendering pressure or mixing.
findings: >-
  porosity_frac: sep 0.58, q 0.11, ws_p 0.18, session_r2 0.69, sep_loo 0.48 -> no difference (Batch_1
  0.0863, Batch_2 0.098, Batch_3 0.107) [rank_features.py with within-session test, 2026-10-03, 31 spots,
  12 columns] Retired 2026-10-03 to features/_retired/porosity (no longer computed): superseded by open_porosity
  (porosity_open_frac); independent audit numbers in its README.
