status: idea
owner: null
implemented_in: null
columns: []
v1_implemented_in: null
v1_columns: null
description: >-
  Solid (graphite) connected components with ECD < 1 um that touch no larger particle (1-px dilation test),
  as a share of solid area and number per 100 um2; Inlens used to exclude carbon-black/binder blobs (bright
  fine texture). Differs from particle_size d10 (a percentile of all particles): this counts free debris
  only.
battery_relevance: >-
  Over-calendering pulverises particles (Ni-rich NMA cathodes, ACS AMI 2021; DEM breakage, Powder Technol.
  2022); fines add surface area (SEI, irreversible capacity) and clog pores.
