id: thin_solid
name: Thin-solid fraction (ligaments, flake tips and slivers thinner than 0.3-0.8 um)
aliases:
- flake tip fraction
- sliver fraction
- solid ligament thickness lower tail
family: morphology
detectors:
- BSE
status: implemented
owner: adarsh
implemented_in: qc/depth_profile.py
columns:
- thin_solid_frac
v1_implemented_in: features/thin_solid
v1_columns:
- thin_solid_frac
description: >-
  Share of the harmonised solid phase lying in ligaments thinner than 0.3 / 0.5 / 0.8 um (distance to
  pore, max-filtered over 9 px to the ligament half-thickness). Hand-crafted translation of the sparse-autoencoder
  latents on DINOv2-L BSE patch tokens that separate Batch_3 from the rest (analysis/interp/): latent
  715 fires on thin slivers and acute flake tips at pore boundaries.
battery_relevance: >-
  Thin ligaments are fine fragments and exposed graphite edges: more edge-plane surface in contact with
  electrolyte means more SEI formation and first-cycle (irreversible) capacity loss, and fragmented, weakly
  connected particles.
findings: >-
  31 spots: B1 / B2 / B3 = 0.0685 / 0.0741 / 0.0795 at 0.5 um (monotonic at 0.3 and 0.8 um too). sep 0.73-0.77,
  q 0.011 for all three, within-split-image ws_p 0.021 (0.3 um) / 0.083 / 0.078 -> separates; session_r2
  0.64-0.68. Spearman +0.6 with the area share of SAE latents 715, 1340 and 1248 (each AUC ~0.99 for Batch_3
  vs rest, family-wise p < 0.001). Crack/lamella ridge filters did not capture latent 1340 (session-dominated).
  [rank_features.py, 2026-10-03] V2 (qc/depth_profile.py, Luca's recipe, 31 spots): B1/B2/B3 0.0891 /
  0.0904 / 0.0885, B3 vs rest AUC 0.48 (p 0.87): the across-spot separation is gone on this recipe; within
  sessions +++ (p 0.04-0.06); B1 vs B2 AUC 0.51. GXL evidence (concept thin_ligaments): charging speed
  4 of 5 papers 'more'; first-charge loss mixed 3/2.
