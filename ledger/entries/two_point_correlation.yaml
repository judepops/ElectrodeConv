id: two_point_correlation
name: Two-point correlation function S2(r) of void, solid and bright phase, direction-resolved
aliases:
- autocorrelation
- correlation length
- s2
- two point probability function
family: spatial_statistics
detectors:
- BSE
status: v1_only
owner: luca
v1_implemented_in: features/two_point_correlation
v1_columns:
- s2_void_corrlen_x_um
- s2_void_corrlen_y_um
- s2_void_integral_range_um2
- s2_bright_corrlen_x_um
- s2_bright_corrlen_y_um
- s2_bright_integral_range_um2
description: >-
  S2 of the shared harmonised void, solid (= not void) and bright masks along rows (x) and columns (y):
  zero-padded FFT autocorrelation per line, normalised by overlap counts. Correlation length = lag where
  (S2 - phi^2)/(phi - phi^2) falls to 1/e. Integral ranges from features._common fraction_se (ImageRep
  idea). s2_solid equals s2_void by the two-phase identity (kept for the schema).
battery_relevance: >-
  Pore size scale and calendering anisotropy without particle segmentation (pore flattening raises through-plane
  tortuosity); bright-phase correlation length tracks Si particle size / clustering (swelling hot-spots);
  the integral range sets the single-image error bar of porosity and Si fraction.
findings: >-
  Final run (rank_features.py + robustness.py --perturb, 31 spots): no detectable batch difference in
  any S2 column (not proven equivalence; only 3 B1 and 5 B2 sites sit in mixed sessions). sep 0.05-0.35,
  q >= 0.62; within-session p 0.37-0.88 except bright x 0.052 / y 0.13 (B1 below the other lot in all
  3 shared sessions, -0.9 / -1.5 SD; does not survive 8 columns, split-half ~0; if real, finer not clustered
  Si); perturbation ratio <= 0.23 (void), <= 0.14 (bright; the builder's 0.81 is superseded). B1's raw
  void-length excess (+0.3 / +0.4 SD) is session 2316 only (4ih2ggld z +2.5 / +3.2; n_eff = 1, invisible
  to the within-session test); without it B1 is -0.1 / -0.3 SD, and within shared sessions -0.8 / -0.9
  SD. Battery reading: no sign of a calendering, wetting or Si-dispersion change (pore x/y 1.54 / 1.63
  / 1.53, within-session p 0.56). Not in the v1 tiers. The void lengths track Tier-2 pore_lt_d50_um (rho
  0.89-0.92), so in v2 they belong as its identity companion, not an extra vote. s2_solid_corrlen_y_um,
  the identity companion of Tier-1 solid_chord_y_um, is the pore scale (r -0.07 with the chord), so that
  check is uninformative and could confirm for the wrong reason (high at 2316 because the pores are larger).
