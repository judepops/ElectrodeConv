id: local_thickness
name: Pore and particle size by local thickness (largest inscribed circle)
aliases:
- continuous pore size distribution
- maximal inscribed sphere
- opening granulometry
- thickness map
family: morphology
detectors:
- BSE
status: v1_only
owner: luca
v1_implemented_in: features/local_thickness
v1_columns:
- pore_lt_d50_um
- pore_lt_d90_um
- solid_lt_d50_um
description: >-
  Area-weighted local thickness (diameter of the largest Euclidean disc that fits in the phase and covers
  the pixel) of the shared harmonised void mask and of the solid (= not void), from an opening granulometry
  by Euclidean discs (scipy EDT). d50 / d90 = diameter where 50 % / 10 % of the phase area is at least
  that thick. Exact at integer-radius resolution via bisection and per-pore crops; solid on a 2x downsampled
  mask (|change| <= 0.03 um vs full resolution). No object splitting, so merged pores do not matter.
battery_relevance: >-
  Pore width sets wetting speed (narrower pores let electrolyte through less easily and fill more slowly);
  ionic resistance is set mainly by porosity and tortuosity, and narrow bottlenecks (constrictivity) add
  to it, which a 2D median width shows only indirectly; solid thickness is the size of the particle/flake
  stacks between pores (solid diffusion length, packing). A shift points at calendering or the graphite/Si
  powder. Replaces the noise-driven connected-component pore_size_*.
findings: >-
  Final run: pore_lt_d50/d90 sep 0.11/0.18, q 0.97/0.91, within-session p 0.56/0.55 (B1 -0.85/-0.53, B2
  -0.40/-0.38 SD), perturbation 0.27/0.21: no detectable change in B1 or B2, but low power (pooled within-session
  d50 CI -0.22 to +0.11 um); B1's raw d50 mean is lifted by session 2316 (n_eff 1; 0.74 um without it);
  d50 Tier 2, 7/7 in range, P(|delta|>margin) 0.06/0.02. solid_lt_d50 B1 4.88 / B2 4.85 vs B3 4.62 um,
  within-session +1.20/+1.52 SD, p 0.068 (B1 has one same-session pair with B3), but sep 0.44, q 0.26,
  perturbation 0.63 (fails 0.5 gate): weak lead, not in verdict, not from 2316. Battery: no detectable
  pore-width change, so no expected wetting change (narrower pores at equal porosity would slow wetting;
  a rate penalty is not established); a coarser solid, if real, is neither good nor bad, only a sign the
  process changed.
