description: >-
  Mean energy of Gabor filter responses at several wavelengths and orientations; gives a scale spectrum
  and an orientation anisotropy.
battery_relevance: >-
  Scale-resolved texture shows at what length scale batches differ; orientation energy tracks flake alignment.
findings: >-
  Not screened, but the related texture family (LBP, GLCM, S2 lengths) was acquisition-dominated: low
  prior; would need noise- and blur-equalised input (features/_common). Source: notes/feature_screen.md
  (Luca's empirical screen, 31 spots, within-mixed-session permutation test, 2026-10-03)
