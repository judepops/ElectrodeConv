description: >-
  Per Si-like bright particle (8-connected objects of the shared harmonised bright mask, features/_common):
  area-weighted ECD d50/d90 with Miles-Lantuejoul edge weights (2D section sizes, Wicksell-biased, relative
  only); area-weighted median solidity (pixel area / convex hull of outline corners) and second-moment
  aspect ratio on interior particles >= 0.5 um2; nematic order <cos 2theta> of long axes vs horizontal
  over particles with aspect > 1.3 (number-weighted: area weighting leaves ~14 effective particles); agglomerate
  d50 after a 0.5 um dilation (no edge correction: networks can span the 33 um window); share of outline
  with void within 6 px (150 nm); CV of bright fraction over 10 um quadrats. Differs from particle_size
  (watershed of all solid, graphite-dominated) and flake_orientation (graphite structure tensor).
battery_relevance: >-
  Si particle size trades lithiation stress, fracture and contact loss (coarse) against surface area,
  SEI and ICE (fine); low solidity is ambiguous (dense aggregates fade fast, mesoporosity buffers stress);
  agglomerates are plausible local swelling hot-spots (inference); outline facing pore instead of carbon
  means weaker electronic wiring and isolation risk (inference, trade-off with free volume); patchiness
  means uneven mixing only after correcting for the Si fraction. Moves with Si powder milling/classification,
  mixing intensity, or a Si grade/composite change.
findings: >-
  Session 2316 (B1 4ih2ggld, 5n1q8atc; n_eff 1 session, only B1, the only curtained images, G-C under
  acquisition gate_status) is the only large signal: solidity -29/-12, agglomerate d50 +9/+10, pore contact
  +4.7/+5.3, d90 +5.4/+3.4 B3-SD (B1 site means sep 0.71/0.62/0.61/0.42, q 0.072/0.15/0.17/0.48); the
  within-session test cannot see it, so B1 fails Tier 2 d90 and agglomerate (5/7) on one session. Part
  of the agglomerate excess is mechanical (2.5-3x Si fraction; fraction-corrected clustering ratio normal
  there). Other B1 spots at or below B3; within shared sessions B1 reads finer (d50/d90 -2.0/-1.8 SD,
  within p 0.021/0.026, sep 0.22/0.42, q 0.83/0.48, split-half ~0: thin). B2: no change established within
  sessions. Orientation +1.7 SD within (all 3 shared sessions, but within p 0.17; sep 0.62, q 0.088) and
  area-weighted aspect +1.6 SD (within p 0.036, q 0.077; number-weighted p 0.98) are a thin hint; quadrat
  CV sep 0.88, q 0.071 but within p 0.25 and explained by B2's lower Si fraction (excess-heterogeneity
  ratio reads B2 more even). Perturbation ratio <= 0.46 except pore contact 0.52; pore contact session
  R2 0.93. Battery reading: 2316 = a different Si product (granular, low solidity, denser; si_grade best
  fit porous/agglomerated Si-C), direction unknown from BSE (bad if dense aggregates, possibly benign
  if engineered porous composite) -> EDS and re-imaging beside a reference; B2 = possibly flatter, flakier
  shards, neither good nor bad (a process-change sign). [rank_features.py + robustness.py, integrated
  run, 2026-10-03, 31 spots]
