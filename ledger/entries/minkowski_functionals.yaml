- pore_n_per_1000um2
v1_implemented_in: features/minkowski_functionals
v1_columns:
- interface_density_per_um
- interface_density_resid_z
- pore_n_per_1000um2
description: >-
  On the shared harmonised void mask: interface density L_A = (pi/4)(P_Lx + P_Ly) from boundary crossings
  per um along rows and columns (S_V = 4/pi L_A for isotropic structure); its residual on porosity from
  a Batch_3-only linear fit, in B3 residual SDs (trained, leave-one-out for baseline spots, models/minkowski_functionals.npz);
  resolvable pores (8-connected void objects >= 64 px = 0.04 um2) and the Euler density (those pores minus
  enclosed 4-connected solid islands >= 64 px), per 1000 um2.
battery_relevance: >-
  Interface length is a 2D proxy for the macro part of the electrode/electrolyte surface where the SEI
  forms (first-cycle loss / ICE scales with accessible surface; BET also counts nanoscale surface the
  image cannot see). At equal porosity, more interface and more pores mean a finer, more divided pore
  network. In 2D the pores are isolated, so the Euler number is about the pore count and says nothing
  about 3D percolation.
findings: >-
  Final run: L_A B1 0.453 / B2 0.497 / B3 0.532 1/um, sep 0.87, q 0.023 (session-blind; session R2 0.72,
  %GRR upper 86 %), within-session p 0.057 (B1 -2.11, B2 -1.42 B3-SD; B1 meets B3 directly in one 2080
  pair only), perturbation 0.60 (gamma 0.8). B1's two 2316 spots are the lowest L_A of 31 and outside
  the within-session test (n_eff = 1 session); without them B1 is -1.2 B3-SD. resid_z sep 0.48, q 0.20,
  within p 0.18, pert 0.38; pore_n (= euler, r 0.99) sep 0.38, q 0.41, within p 0.41, pert 0.66. Battery:
  incoming lots read lower L_A, about half from lower porosity; if real a trade-off (less SEI surface,
  higher ICE, vs longer diffusion, poorer rate); a pore-count change would be neither, only a sign the
  process changed; not established. Tier 2: B1 6/7 and B2 7/7 pass on both columns; certificate P(|delta|
  > margin) for L_A 0.60 (B1), 0.13 (B2); not a reason for either INVESTIGATE. [rank_features.py + robustness.py
  + verdicts, integrated run]
