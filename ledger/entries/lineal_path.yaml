id: lineal_path
name: Lineal path and chord-length distributions (x and y)
aliases:
- chord length distribution
- intercept length
- mean chord length
family: spatial_statistics
detectors:
- BSE
status: implemented
owner: luca
implemented_in: cnn/tile_features.py
columns:
- solid_chord_x_um
- solid_chord_y_um
- solid_chord_hv_ratio
v1_implemented_in: features/chord_length
v1_columns:
- solid_chord_x_um
- solid_chord_y_um
- solid_chord_hv_ratio
description: >-
  Number-weighted mean chord (intercept) length of the solid (= not void) and pore phase along rows (x,
  in-plane) and columns (y, through-plane) of the shared harmonised void mask (features/_common). Border-cut
  chords are handled by L = V_V/N_L with N_L = P_L/2 (default; config switch to minus-sampling with Miles-Lantuejoul
  weights). H/V = solid x / solid y. Only the chord part is built; the lineal-path function itself was
  not (research report: do not build).
battery_relevance: >-
  The through-plane solid chord is the closest image stand-in for graphite flake thickness / PSD (D50
  is CoA item #1): longer solid-state diffusion paths if longer, more surface and SEI if shorter. The
  H/V ratio measures calendering / flake alignment, which sets through-plane tortuosity. Pore chords are
  a directional pore width.
findings: >-
  Final run (rank_features.py / robustness.py, 31 spots): solid_chord_x_um B1 6.93 / B2 6.23 / B3 5.80
  um, sep 0.91, q 0.027, within-session p 0.026 (joint test; B1 +2.5, B2 +1.7 B3-SD), perturbation 0.53;
  solid_chord_y_um (Tier 1) 5.93 / 5.29 / 4.92 um, sep 0.91, q 0.029, within p 0.12 (B1 +2.4, B2 +1.5),
  perturbation 0.62 (gamma); BH over 68 within-session tests q 0.45 / 0.49, so a lead on x and not shown
  on y. H/V (Tier 2) and pore chords flat (q >= 0.91, within p >= 0.24). The B1 Tier-1 delta (+1.01 um,
  P(beyond) 0.79) is carried by the two session-2316 spots (n_eff = 1, outside the within-session test),
  which also carry the Si-phase anomaly and the strongest curtains; without them the raw B1 delta is +0.60
  um, inside the 0.686 um margin. Reading, if real: fewer pores per line at the same pore width; neither
  good nor bad, a sign the supplier's process changed (a rate-vs-SEI trade-off only if it is coarser graphite,
  which the chord cannot show).
