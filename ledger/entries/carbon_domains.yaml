id: carbon_domains
name: Two-level graphite domains (blend vs channelling)
aliases:
- dark graphite domains
- graphite blend
- natural synthetic graphite
family: composition
detectors:
- BSE
- Inlens
status: v1_only
owner: luca
v1_implemented_in: features/carbon_domains
v1_columns:
- carbon_dark_domain_frac
description: >-
  Share of the graphite interior in the darker of two BSE graphite grey levels (drift-corrected 0.5 um
  level map; 2-component Gaussian mixture at and below the main graphite peak, >= 6 % contrast gate; patches
  >= 25 um2), plus the share of dark/main interfaces lying on particle boundaries (void/bright edges or
  Inlens ridges): whole-particle contrast suggests a blend, contrast inside particles suggests electron
  channelling. Differs from carbon_binder_domain: that is the binder/carbon-black web between particles,
  this is two grades of the active graphite itself.
battery_relevance: >-
  The natural/synthetic graphite blend ratio is a hidden supplier change. It moves first-cycle efficiency
  through surface area (Winter 1998) and slurry extensional rheology (JCIS 2024), and natural graphite
  is weaker at fast and low-temperature charging (Adv. Mater. 2022). Capacity, cycle-life and swelling
  differences are general knowledge with no verified citation. A CoA reports neither the ratio nor how
  the grades are mixed.
findings: >-
  Final integrated run: dark fraction B1 0.013 / B2 0.082 / B3 0.028 (domains in 4/7, 3/7, 2/17 spots),
  sep 0.46, q 0.33, within-session p 0.31 (192 relabellings), session R2 0.63, perturbation ratio 0.24.
  The session-adjusted B1 -1.70 SD comes from session 2080 alone (-0.21 SD without it); B2 is -0.79 SD
  (-0.49 without 2080). Boundary share sep 1.61, q 0.075 (cross-spot shuffle, ignores session), but within-session
  p 1.00 (session 2080 only), perturbation ratio 1.00 (fails 0.5), and the excess over chance is similar
  in all batches (+0.23 / +0.21 / +0.22, n 4/3/2; permutation p 0.80; inside 2080 +0.19 / +0.24 / +0.19).
  B1's higher raw share is its higher chance level. Battery reading: no sign of a graphite blend or grade
  change in B1 or B2 (low confidence). The two session-2316 B1 spots (Si-phase lead, n_eff = 1) read 0;
  a full switch to one other grade would also read 0. A shift would be neither good nor bad, only a sign
  the supplier's graphite recipe may have changed (ICE and capacity direction unknown until the grades
  are identified). A high boundary share can also come from pore-back. Tier 3 diagnostic; compare within
  session only.
